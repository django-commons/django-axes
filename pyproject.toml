[build-system]
requires = ["setuptools>=84.2.1", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-axes"
dynamic = ["version", "readme"]
description = "Keep track of failed login attempts in Django-powered sites."
authors = [
    {name = "Josh VanderLinden"},
    {name = "Philip Neustrom"},
    {name = "Michael Blume"},
    {name = "Alex Clark"},
    {name = "Camilo Nova"},
    {name = "Aleksi Häkli"},
]
maintainers = [
    {name = "Django Commons", email = "django-commons-admins@googlegroups.com"},
]
keywords = ["authentication", "django", "pci", "security"]
dependencies = [
    "django>=5.2",
    "asgiref>=3.6.0",
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Environment :: Plugins",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: Log Analysis",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

[project.optional-dependencies]
ipware = ["django-ipware>=3"]

[project.urls]
Homepage = "https://github.com/django-commons/django-axes"
Documentation = "https://django-axes.readthedocs.io/"
Changelog = "https://github.com/django-commons/django-axes/blob/master/CHANGES.rst"
Issues = "https://github.com/django-commons/django-axes/issues"

[tool.setuptools.packages.find]
include = ["axes*"]

[tool.setuptools.dynamic]
# The changelog is shown after the README on PyPI
readme = {file = ["README.rst", "CHANGES.rst"], content-type = "text/x-rst"}

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "--cov axes --cov-append --cov-branch --cov-report term-missing --cov-report=xml"
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.tox]
legacy_tox_ini = """
[tox]
envlist =
    py{311,312,313,314}-dj52
    pypy311-dj52
    py{312,313,314}-dj60
    py{312,313,314,315}-dj61
    py314-djmain
    py314-djqa

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
    pypy-3.11: pypy311

[gh-actions:env]
DJANGO =
    5.2: dj52
    6.0: dj60
    6.1: dj61
    main: djmain
    qa: djqa

# Normal test environment runs pytest which orchestrates other tools
[testenv]
deps =
    -r requirements.txt
    dj52: django>=5.2,<5.3
    dj60: django>=6.0,<6.1
    dj61: django>=6.1,<6.2
    djmain: https://github.com/django/django/archive/main.tar.gz
usedevelop = true
commands =
    !pypy311: pytest
    # The test run fails on PyPy when coverage is measured
    pypy311: pytest --no-cov
setenv =
    PYTHONDONTWRITEBYTECODE=1
# Django development version is allowed to fail the test matrix
ignore_outcome =
    djmain: True
ignore_errors =
    djmain: True

# QA runs type checks, linting, and code formatting checks
[testenv:py314-djqa]
stoponfail = false
deps = -r requirements.txt
commands =
    mypy axes
    prospector axes
    black --check --diff axes
"""
